<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شريط الاختبار العملي</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f8f8f4;color:#111;overflow:hidden}
.shell{height:100%;display:grid;grid-template-columns:190px 118px minmax(260px,1fr) 145px;gap:8px;padding:8px 14px;border-top:5px solid #087d71;background:#fbfbf8;align-items:stretch}
.finish{background:#087b18;color:white;border:2px solid #075f14;border-radius:3px;font-weight:bold;font-size:19px;line-height:1.5;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{height:50%;border:2px solid #287b42;background:#fff;color:#111;font-weight:bold;font-size:15px;cursor:pointer}
.instruction{border:3px solid #222;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px 14px;min-width:0}
#taskTitle{display:none}#prompt{font-size:clamp(15px,1.55vw,25px);font-weight:bold;line-height:1.25;max-height:65px;overflow:auto}
.timer{border:3px solid #222;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#256b37;font-weight:bold}
.timer span:first-child{font-size:20px}.timer strong{font-size:27px;font-variant-numeric:tabular-nums}
@media(max-width:760px){.shell{grid-template-columns:110px 90px minmax(160px,1fr) 100px;gap:4px;padding:5px}.finish{font-size:14px}.nav button{font-size:12px}#prompt{font-size:15px}.timer span:first-child{font-size:14px}.timer strong{font-size:20px}}
</style>
</head>
<body>
<div class="shell">
<button class="finish" id="finish">إنهاء وإرسال<br>الامتحان</button>
<div class="nav"><button id="prev">السؤال السابق</button><button id="next">السؤال التالي</button></div>
<div class="instruction"><div id="prompt">جارٍ تحميل السؤال...</div></div>
<div class="timer"><span>الوقت المتبقي</span><strong id="clock">20:00</strong></div>
</div>
<script src="office-bar.js"></script>
</body></html>
